# Độ dài TỰ DO: không nhắm phút, không nắn, không chấm độ dài — truyện dài
# ngắn theo câu chuyện (chủ dự án 25/08/2026). `phut_muc_tieu` ở trên không dùng.
do_dai_tu_do: true
engine: "veo3"
# Khung hình đầu của clip CHÍNH LÀ tấm ảnh vừa vẽ (`frame_mode: start_frame`),
# không phải một tấm Veo tự nghĩ ra từ chữ. Đúng luật của OpenStory cho lời
# nhắc chuyển động: *"the still IS the exact first frame the video model will
# animate from"*. Mã tool đã đo 26/08/2026: không ghim thì sau 8 giây nhân vật
# đã đổi. Kênh `hoathinh-3d` bật sẵn; kênh này bật 27/08/2026.
khung_dau: true
# Vẽ thêm một tấm ảnh KHUNG CUỐI mỗi cảnh rồi ghim clip CẢ HAI đầu. Đo
# 27/08/2026 trên ba clip trôi nặng nhất: cảnh 11 đi 2 → 4 điểm, cảnh 2 đi
# 3 → 4, và clip kết thúc gần trùng khít tấm khung cuối (lệch 1,4-5,4/255).
# Tốn thêm một tấm ảnh mỗi cảnh.
ghim_hai_dau: true
# Chấm từng tấm ảnh với ảnh tham chiếu, lệch quá thì vẽ thêm và giữ tấm hơn.
# Đo 27/08: 4 cảnh yếu cứu được cả 4, điểm giống 3,83 → 4,00.
cham_anh: true
so_thumbnail: 3
mo_hinh: "claude-sonnet-5"
# KHÔNG đốt phụ đề vào hình. Chủ dự án 28/08/2026: *"template này mày đừng để
# nó edit phụ đề vì phụ đề đang xấu"* — phim của kênh này còn đi qua CapCut,
# chữ sẽ làm ở đó. Tệp `3-phu-de.srt` vẫn được tạo đầy đủ để mang sang.
dot_phu_de: false
# Giữ TIẾNG CẢNH của clip (bước chân, chim hót, nước, gió) nằm dưới giọng đọc,
# và xuất riêng `8-tieng-canh.m4a` để trộn tay ở CapCut. Bật ô này thì khâu
# clip tự ghim thêm câu cấm nhạc và cấm mọi lời nói vào lời nhắc — xem
# `core/auto_khau.LUAT_TIENG_CANH`.
giu_tieng_canh: true
# Độ to tiếng cảnh trong bản đã trộn. Chủ dự án 28/08: *"âm thanh phụ to quá
# thì nó bị lấn mất voice… bé hơn chút sẽ không bị át nhạc nền sau thêm vào"*.
# Đo trên phim 0008: tiếng cảnh trung bình -31,3 dB nghe rất nhỏ, nhưng ĐỈNH
# -1,6 dB ngang hẳn giọng đọc (-1,4 dB) — một tiếng nước bắn là vọt lên bằng
# lời kể. 0,35 hạ đỉnh ấy xuống -10,7 dB.
# ⚠ Chỉ đổi bản đã trộn. `8-tieng-canh.m4a` xuất riêng luôn giữ MỨC GỐC để
# khách tự chỉnh ở CapCut.
am_luong_tieng_canh: 0.35
am_luong_nhac: 0.12
