ten: "Truyện cổ tích (lối OpenStory)"
ngon_ngu: "vi"
giong_van: "Vietnamese fairy-tale narration for children 4–10: warm, gentle, playful storyteller voice; short simple sentences; lively dialogue; sound words; the narrator speaks to the child listener (các bạn nhỏ / các con)."
