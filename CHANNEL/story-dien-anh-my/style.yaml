style_name: "photoreal_american_family_drama_glossy"
image_style: "glossy photorealistic American drama still with the glamour of a big-studio movie, warm golden light with soft bokeh, rich jewel-tone wardrobe, the heroine strikingly beautiful and poised, attractive well-groomed American adults, crisp sharp focus on faces, realistic skin with a soft glow, bright commercial cinematic look, ensemble staging with several characters reacting in one frame"
video_style: "photorealistic live-action shot, warm golden light, slow gentle push-in, the characters act the moment with clear emotion (laughing, gasping, turning, pointing), the light and colour grade stay identical for the whole clip and must not darken, grey out or shift hue"
thumbnail_style: "bright glossy photorealistic close portrait of the heroine at her winning moment: stunning, glamorous, radiant, framed from the waist up so she dominates the picture, face large and sharp, elegant jewel-tone outfit, fine jewellery, warm golden light, luxurious setting softly blurred behind her"
scene_plan_style: "American family-drama language: ensemble shots in bright upscale American places — big suburban homes with open kitchens, backyard birthday parties, restaurants with fairy lights, country-club dinners, lawyers' offices, hospital rooms — every picture shows who confronts whom and what object is between them"
palette: "warm golden light, jewel tones (royal blue, emerald, burgundy), creamy whites, natural skin tones (#E9B872, #1F4E9C, #0F6B4E)"
negative_prompt: "no text, no letters, no numbers, no watermark, no logo, no extra fingers, no distorted hands, no deformed faces, no cartoon, no anime, no illustration, no painting, no 3D render look, no plastic skin, no dark gloomy lighting, no plain, tired, aged or frumpy heroine, no wrinkles or grey hair on the heroine, no unattractive leads"
reference_lock: "Every character keeps exactly the face, hair, age, body shape, outfit and props of its own reference image; outfit changes only where the story says so (a new reference image exists for that stage); the glossy photographic drama look stays identical in every shot"
technical_suffix: "glossy photorealistic drama still, warm golden light, bokeh, sharp focus, no text, no letters, no watermark"
engagement_rules: "put every character of the confrontation in the frame when the line is a clash, give each face a clear readable emotion, hold on hands and objects at the turning points (a credit card on the counter, a birthday cake, divorce papers held shut, a wedding ring, a phone turned away from us, a set of car keys), keep the rich setting visible behind them, end each shot on a change the viewer notices"
default_character_prompt: "CASTING FOR AN AMERICAN BETRAYAL-AND-COMEBACK DRAMA — the audience are women who see themselves in the heroine, so she must be the most attractive person on screen. THE HEROINE (the narrator, the betrayed wife): an American woman who LOOKS 29-35 even when the story says she is 40-55 (actresses play older roles), stunningly beautiful like a movie star, radiant glowing skin, refined features, striking eyes with soft smoky makeup, rosy-nude lips, an elegant hairstyle (a soft chignon updo with loose face-framing strands, or long glossy waves in brunette, chestnut or honey-blonde), delicate jewellery (drop earrings, a fine necklace), slim graceful figure, chic feminine clothes in one rich signature colour (emerald, black, ivory, cream knit, royal blue, burgundy) — calm, confident and dignified even when she is hurt, often with a quiet knowing look. THE HUSBAND (who cheats or takes her money): looks 38-45, handsome and well-groomed, expensive suit or smart casual, a smug charming face. THE OTHER WOMAN: 26-32, glamorous and sleek, flashy designer dress, perfect hair. IN-LAWS AND RELATIVES: elegant and well-dressed (pearls, tweed, silk) — a mother-in-law may look 60-70 but stays refined, never shabby. CHILDREN keep the ages the story gives. Never describe wrinkles, grey hair, tired eyes, dark circles or a worn look on the heroine — her pain shows in the situation, never in her face"
default_character_lock: "photorealistic live-action American cast: the heroine looks 29-35 and stunningly beautiful, the husband looks 38-45 and handsome; one signature colour each; face, hair, age and outfit fixed per reference image"
thumb_text_style: "bold white uppercase letters with key phrases in orange and pink, heavy black outline, stacked lines like a quote"
thumb_text_shadow: "hard dark drop shadow"
thumb_text_hex: "#FFFFFF"
thumb_text_font: "heavy condensed sans-serif, uppercase"
audience_language: "English (United States)"
audience_culture_note: "Design for American adults listening to first-person family revenge stories told by a woman: a husband who says 'stop living off me', in-laws who humiliate her, a birthday party that falls apart, an inheritance, a divorce she wins quietly. Settings are upscale everyday America: big suburban houses with open kitchens and islands, backyard parties, nice restaurants with fairy lights, country clubs, lawyers' offices, hospital rooms."
cultural_props: "kitchen island, credit card slammed on a counter, birthday cake, party tables, wine glasses, a gift box, divorce papers held shut, wedding ring, car keys, smartphone turned away, suitcase by the door, house keys"
cultural_metaphors: "humiliation: friends laughing behind the narrator at a party | dignity: the narrator standing straight with her arms crossed | truth revealed: the husband's face going pale | justice: empty party tables where the feast should be | new beginning: the narrator smiling alone in a sunny room"
cultural_emotion_style: "Clear, readable soap-drama emotions: mocking laughter, a shocked gasp, arms crossed in disbelief, a finger pointing, a face going pale, a calm knowing smile at the payoff — readable in one second. No blood, no violence."
