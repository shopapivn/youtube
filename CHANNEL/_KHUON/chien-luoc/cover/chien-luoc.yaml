# ============================================================================
#  CHIẾN LƯỢC COVER — đổi đúng một câu hỏi
# ============================================================================
#  Chiến lược đè lời nhắc lên ngách, chỉ đè đúng những tệp nó đổi.
#  Cover đè HAI tệp: `2-viet.md` và `3-sua.md`. Sáu tệp còn lại vẫn của ngách.
#
#  ── Khác Remake ở đúng một chỗ ─────────────────────────────────────────────
#
#    Remake hỏi:  "ĐÃ GIỐNG bản gốc CHƯA?"
#    Cover  hỏi:  "ĐÃ HƠN bản gốc CHƯA?"
#
#  Chỉ có thế. Không thêm bước, không thêm phép chấm, không thêm bảng biểu.
#
#  ── Vì sao KHÔNG làm phức tạp hơn ──────────────────────────────────────────
#
#  Bản đầu của chiến lược này có năm bước: mổ bản gốc ra JSON, dựng dàn ý có
#  ngân sách ký tự từng phần, viết từng phần một, chấm bảy phép, rồi khâu lại.
#  Nghe thì chặt chẽ.
#
#  Chủ dự án, 19/08/2026: *"kể cả tl5 cũng nên theo logic đơn giản đừng quá
#  nhiều yêu cầu vì bản chất AI quá nhiều thứ nó sẽ cứng và không hay"* — và
#  *"2 cái prompt ở tl4 là tiêu chuẩn vì với logic đó đã bật kiếm tiền nhiều
#  kênh"*.
#
#  Đó là bằng chứng từ kênh đã ra tiền, không phải ý kiến. Bộ hai lời nhắc để
#  AI tự xoay; bộ năm bước bắt nó điền vào ô. Thứ hai chặt hơn trên giấy và
#  cứng hơn khi đọc lên.
#
#  ── Chỗ rò mà cover nhắm tới, đo được thật ─────────────────────────────────
#
#  Lượt chạy thật của TL4-T7 ngày 19/08/2026, nguồn `zb2KiFeC5l4` (10:40).
#  Đếm các đoạn 12 ký tự liên tiếp trong bài mới trùng nguyên văn bản gốc,
#  chia bài làm năm phần đều nhau:
#
#      phần 1/5   7,1%
#      phần 2/5  20,4%
#      phần 3/5  38,5%
#      phần 4/5  38,3%
#      phần 5/5  42,3%     ← gần một nửa là nguyên văn
#
#  Tăng đều một mạch: AI viết thật ở đầu rồi trượt dần thành chép lại. Đoạn kết
#  gần như trùng khít với bản gốc.
#
#  Nên cover chỉ thêm đúng MỘT dòng vào mỗi lời nhắc, nhắm thẳng chỗ đo được:
#
#    `2-viet.md`  "Càng về cuối càng không được bám câu chữ bản gốc."
#    `3-sua.md`   "Chỗ nào còn bám câu chữ bản gốc thì viết lại chỗ đó.
#                  Soi kỹ phần cuối bài."
#
#  Một phép đo, một dòng chữ. Không phải một cỗ máy.
#
#  ── Chiến lược này cần gì ──────────────────────────────────────────────────
#
#  CẦN có bản gốc. Không có link đối thủ thì không có gì để làm hơn.
# ============================================================================

ten: "Cover — làm hơn bản gốc"
mo_ta: "Cùng khuôn hai lời nhắc như Remake, chỉ đổi câu hỏi lúc soát: không hỏi ĐÃ GIỐNG CHƯA mà hỏi ĐÃ HƠN CHƯA. Thêm một dòng chặn thói bám câu chữ bản gốc ở cuối bài."

