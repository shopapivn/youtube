# ============================================================================
#  PHONG CÁCH KÊNH story-dien-anh-my-sang — PHIM TÌNH CẢM LÃNG MẠN, ẢNH THẬT
# ============================================================================
#  Tuyến nội dung (chủ dự án 01/10/2026): TÌNH YÊU — cô gái nghèo tử tế bị chê
#  bai gặp người đàn ông trong mơ: giàu, tài giỏi, đẹp trai. Người xem phải
#  thấy như xem một bộ PHIM TÌNH CẢM LÃNG MẠN: hai vai chính TRẺ, ĐẸP, CUỐN HÚT.
#
#  Bản trước ("drama sang trọng, người Mỹ ưa nhìn") không nói tuổi, không ép
#  vai chính phải đẹp — AI tuyển vai theo tuổi trong truyện, ra người trung
#  niên mặt thường; cảnh thì toàn nhà hàng tối đèn chùm. Chủ dự án: "nhân vật
#  già và xấu, không thu hút, cảnh cũng chả có gì đặc biệt". Khuôn mới theo 12
#  bìa thắng của kênh dẫn đầu ngách: nữ chính 22–28 rất xinh, tóc dài gợn sóng,
#  váy pastel; nam chính 30–36 đẹp trai, vest navy may đo; nơi chốn châu Âu /
#  Mỹ sang, nắng ấm — tiệm may, quán cà phê, chợ, phố mưa, đại sảnh.
#
#  ⚠ CHỈ GHI MỤC TIÊU, KHÔNG GHI MÀU/ĐỒ VẬT CỤ THỂ (09/10/2026). Bản trước
#  kê màu áo pastel trong `palette` và "full of flowers" / "flowers and soft
#  bokeh" ở `image_style` / `technical_suffix` — các khoá ấy bị dán vào MỌI
#  cảnh, nên 68% cảnh của khách bị nhét hoa và áo nhuộm theo bảng màu.
#
#  ⚠ KHÔNG ĐẶT KHOÁ API VÀO ĐÂY. Tool quét và chặn.
# ============================================================================

style_name: "photoreal_hollywood_romance_film"
image_style: "bright photorealistic American Hollywood romance-movie still, sunlit and warm, golden-hour daylight or warm glowing interiors, charming, aspirational European-style and upscale American places, soft creamy bokeh, rich true colours, the two American leads young, beautiful and magnetic, crisp sharp focus on faces, realistic skin with a soft glow, polished cinematic colour grade like a big-studio romantic drama"
video_style: "photorealistic live-action romance-movie shot, warm golden light, slow gentle push-in or soft dolly, the characters act the moment with clear emotion (a lingering look, a shy smile, a surprised turn, a hand reaching out), hair and fabric move softly, the light and colour grade stay identical for the whole clip and must not darken, grey out or shift hue"
thumbnail_style: "bright glossy photorealistic romance-drama movie poster: the two leads big in the frame (chest-up, 70-85% of the picture), a handsome man in a tailored suit and a very pretty woman in a bright dress or neat uniform, a charged look between them, side characters smaller behind, high-key saturated light, glamorous place softly blurred behind, crisp faces"
scene_plan_style: "Romance-movie language: the underdog heroine in charming everyday places (a tailoring workshop, a flower shop, a bakery, a sunny café terrace, a farmers market, a rainy city street with a bus stop) crossing paths with the hero, then the glamorous world he belongs to (a sunlit fine-dining room, a grand hotel lobby, a ballroom with a grand piano, a glass office over the city, a Mediterranean terrace) — every picture keeps the two of them, their looks and the small object that ties them together"
palette: "colour grade of light and set only (never clothing): warm golden sunlight, soft bright romantic tones, warm wood and cream interiors, natural skin tones"
negative_prompt: "no text, no letters, no numbers, no watermark, no logo, no extra fingers, no distorted hands, no deformed faces, no cartoon, no anime, no illustration, no painting, no 3D render look, no plastic skin, no dark gloomy lighting, no blood, no weapons, no middle-aged or elderly lead characters, no plain, tired or unattractive faces on the leads, no frumpy or drab clothes on the heroine"
reference_lock: "Every character keeps exactly the face, hair, age, body shape, outfit and props of its own reference image; outfit changes only where the story says so (a new reference image exists for that stage); the glossy luxury photographic look stays identical in every shot"
technical_suffix: "photorealistic romance-movie still, warm golden light, soft bokeh, sharp focus on beautiful faces, no text, no letters, no watermark"
engagement_rules: "keep the hero and the heroine in the same frame whenever both are in the beat, show the look between them (eye contact, a stolen glance, a shy smile, a stunned stare), hold on the small object that ties them together (a sewing machine, a bouquet, a coffee cup, a grocery cart, an umbrella, a book, a ring box), mockers and side characters stay smaller and behind, the beautiful place stays visible behind them"
default_character_prompt: "CASTING FOR AN AMERICAN ROMANCE MOVIE — the two LEADS are American and must be young, beautiful and magnetic like Hollywood romance stars. THE HEROINE (the kind, underestimated woman): 23-28 years old, strikingly beautiful, delicate features, bright clear eyes, long glossy hair, soft natural makeup, slim graceful figure; even when she is poor she wears a simple but pretty feminine outfit in one soft signature colour that you choose to fit her — preferably a flowing dress or a soft blouse with a skirt; a work uniform is neat, fitted and flattering — never drab, shabby or plain trousers-and-t-shirt. THE HERO (the rich, brilliant man of her dreams): 30-36 years old, tall, strikingly handsome, strong jaw, light stubble, thick well-styled dark hair, confident warm eyes, athletic build, a perfectly tailored suit in a colour that suits him, with a crisp shirt (or an expensive casual shirt with rolled sleeves when he hides who he is). Cast like a movie: the leads LOOK these ages even when the narration states an older age for them (actors play older roles), and their description never mentions wrinkles, grey hair, tired eyes, dark circles, fatigue or a worn look — hardship shows in the situation, never in their faces. Only a side character the story clearly calls old (a grandmother, an elderly father) may look older. Side characters are attractive, well-groomed and well-dressed too — mockers look glamorous and smug, never ugly. COLOURS: give every recurring character their OWN signature outfit colour that fits their role, and make the colours clearly different from one another so viewers tell people apart at a glance — no colour shared by two main characters, and no single colour dressing most of the cast"
default_character_lock: "photorealistic live-action romance-movie cast: the heroine 23-28 and strikingly beautiful, the hero 30-36 and strikingly handsome; one signature colour each; face, hair, age and outfit fixed per reference image"
thumb_text_style: "bold white condensed letters with a thin dark outline, one key word in gold"
thumb_text_shadow: "hard dark drop shadow"
thumb_text_hex: "#FFFFFF"
thumb_text_font: "heavy condensed sans-serif"
audience_language: "English (United States)"
audience_culture_note: "Design for American women 35-65 who love romance-drama stories: a kind, underestimated young woman (a seamstress, a waitress, a florist, a baker, a cleaner) is mocked by snobs and meets the man of her dreams — rich, brilliant and handsome — who sees her worth. Settings are charming and aspirational: sunlit cafés, flower shops, markets, rainy city streets, fine-dining rooms, grand hotel lobbies, ballrooms with a grand piano, Mediterranean terraces."
cultural_props: "vintage sewing machine, bouquet of fresh flowers, coffee cups, croissants and pastries, grocery cart, umbrella in the rain, hardcover book, tablet, menu, ring box, handwritten note, car keys, city bus"
cultural_metaphors: "first meeting: their eyes meet across a sunlit café | being mocked: snobs laughing behind a hand while she holds her chin up | the reveal: the whole room turning as he walks to her side | falling in love: his coat around her shoulders in the rain | happy ending: him offering his hand under warm golden light"
cultural_emotion_style: "Clear, readable romance-drama emotions: a shy smile, a lingering look, wide surprised eyes, a tear on a soft cheek, a smug smirk from the snob, a calm protective look from the hero — readable in one second. Tender and hopeful, never dark. No blood, no violence."
