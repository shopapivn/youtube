# ============================================================================
#  KÊNH story-dien-anh-han — Truyện drama gia đình Hàn, ảnh thật kiểu K-drama
# ============================================================================
#  Cùng cách làm với story-dien-anh-my: GIỮ NGUYÊN lời kể đối thủ, `2-viet.md`
#  chỉ sửa chữ nghe nhầm / chính tả / cách viết cách (띄어쓰기), `3-sua.md` chỉ
#  tách câu + chèn thẻ cảm xúc (core/giu_noi_dung.py). Hình theo mẫu chủ dự án
#  25/09/2026 (Downloads/form/form hàn.PNG, kênh 노후사연): ảnh thật sáng bóng,
#  căn hộ Seoul sang trọng, mẹ chồng – nàng dâu – chồng cùng khung, cảm xúc
#  mạnh kiểu makjang.
#
#  Chỉ 10 cảnh đầu làm clip Veo; các cảnh sau là ảnh, khâu dựng cho ảnh chuyển
#  động ngẫu nhiên (zoom/lia) và nối cảnh bằng hiệu ứng chuyển ngẫu nhiên.
# ============================================================================
# ── Kênh MẪU của tool ─────────────────────────────────────────────────────────
