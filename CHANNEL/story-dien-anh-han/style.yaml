thumb_text_style: "two lines of bold Korean letters with a thick black outline, top line bright green, bottom line bright pink"
thumb_text_shadow: "thick black outline, no soft shadow"
thumb_text_hex: "#3CFF4F"
thumb_text_font: "heavy Korean gothic typeface"
audience_language: "Korean (South Korea)"
audience_culture_note: "Design for Korean adults (many 40+) watching 노후사연 / family-drama stories: 시어머니 against 며느리 (often pregnant), 친정 and 시댁 conflicts, 제사, inheritance fights, a luxury handbag bought with the wrong money, a husband who finally sees the truth, an affair uncovered. Settings are wealthy modern Korea: high-rise luxury apartments with marble kitchens and city views, penthouse living rooms, hospital VIP rooms, funeral halls with white chrysanthemums, wedding halls, glass company towers, hotel lobbies."
cultural_props: "apartment door with a keypad, marble kitchen island, family dinner table with many side dishes, luxury handbag, envelope of money, bankbook, smartphone with evidence (screen turned away), pregnancy test, hospital bracelet, wedding ring, divorce papers held shut, courier boxes, funeral chrysanthemums, black sedan"
cultural_metaphors: "betrayal: a mother-in-law pouring the daughter-in-law's food into the sink | dignity: a pregnant wife standing straight while everyone stares | truth revealed: a husband stopping in the doorway | inheritance: an envelope pushed across a dinner table | justice: the mother-in-law's face falling as the evidence appears"
cultural_emotion_style: "Big, readable K-drama emotions: tears streaming, a shocked open mouth, a mother-in-law's cold glare, a husband rushing in, a finger pointing, a hand grabbing a wrist — clear in one second, like a TV-drama still. No blood, no hitting."
